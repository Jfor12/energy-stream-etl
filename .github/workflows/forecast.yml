name: Grid Forecast

on:
  schedule:
    - cron: '37 */3 * * *'  # every 3 hours; collects the latest readings itself first
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Forecast but don't store anything"
        type: boolean
        default: false

concurrency:
  group: grid-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-forecast.txt

      - name: Install (CPU-only PyTorch, then Chronos)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-forecast.txt

      - name: Cache the model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-chronos-bolt-small

      # GitHub often starts scheduled runs hours late, or skips them, so the
      # hourly ETL can't be relied on to have run just before this. Collecting
      # first means the forecast starts from the latest hour. If it fails, the
      # forecast still runs when the data is recent enough (and refuses when not).
      - name: Collect the latest readings first
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python etl_job.py $DRY_RUN

      - name: Forecast the next 24 hours
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python forecast.py $DRY_RUN
