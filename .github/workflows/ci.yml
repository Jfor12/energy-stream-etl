name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (including the database tests)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: python -m pytest -v

  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Dashboard unit tests
        working-directory: dashboard
        run: node --test tests/*.test.mjs

  live-api:
    # Checks the real Carbon Intensity API still returns what the ETL expects.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python etl_job.py --dry-run --days 2

  forecast-model:
    # Checks the Chronos model downloads and forecasts, without a database.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-forecast.txt
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-forecast.txt
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-chronos-bolt-small
      - run: python forecast.py --smoke
