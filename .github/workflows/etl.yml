name: Grid ETL Pipeline

on:
  schedule:
    - cron: '7 * * * *'  # hourly; each run re-reads the last 24 hours, so delayed or skipped runs leave no gaps
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to load (more than 1 backfills history)'
        default: '1'
      dry_run:
        description: 'Fetch and validate only, without writing to the database'
        type: boolean
        default: false

concurrency:
  group: grid-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Run ETL job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DAYS: ${{ inputs.days || '1' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python etl_job.py --days "$DAYS" $DRY_RUN

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: etl-log
          path: etl_pipeline.log
          retention-days: 30
